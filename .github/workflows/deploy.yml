# Builds the site and publishes it to GitHub Pages on every push to main or
# jen_testing. (Publishing from jen_testing also needs that branch allowed in
# Settings -> Environments -> github-pages -> Deployment branches and tags.)
# Needs two repository variables (Settings -> Secrets and variables -> Actions
# -> Variables): VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, jen_testing]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # The site is served from https://<owner>.github.io/<repo>/
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
